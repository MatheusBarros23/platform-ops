name: Deploy

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App name (must match charts/ folder)"
        required: true
      image_tag:
        description: "Image tag to deploy (e.g. sha-abc1234 or 1.2.0)"
        required: true
      environment:
        description: "Target environment"
        required: true
        default: production
        type: choice
        options:
          - production
          - staging

jobs:
  deploy:
    runs-on: deploy-cluster
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Write kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Deploy with Helm
        run: |
          helm upgrade --install ${{ inputs.app }} ./charts/${{ inputs.app }} \
            --set image.tag=${{ inputs.image_tag }} \
            --namespace ${{ inputs.environment }} \
            --create-namespace \
            --wait --timeout=120s
